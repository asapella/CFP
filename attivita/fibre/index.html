<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missione Fibre</title><style>
body{margin:0;background:#12263a;color:white;font-family:Arial,Helvetica,sans-serif;background-image:linear-gradient(180deg,#1d7bd1,#162740)}
header{padding:18px 24px;background:#0b1828;border-bottom:4px solid #39e75f}h1{margin:0;font-size:34px;color:#7CFF4E;text-shadow:3px 3px #0a0a0a}p{margin:5px 0 0;color:#d7ecff}
.wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;padding:18px;max-width:1500px;margin:auto}.panel{background:rgba(5,18,35,.88);border:3px solid #42d2ff;border-radius:18px;padding:16px;box-shadow:0 0 18px rgba(66,210,255,.4)}
.levels{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:16px 18px 0}.lv{background:#1f3e5e;border:2px solid #42d2ff;border-radius:12px;text-align:center;padding:8px;font-weight:900}.lv.active{background:#ffd44a;color:#172033}.lv.done{background:#40d95a;color:#102010}
.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.food{background:#244866;border:3px solid #76e94d;border-radius:16px;padding:10px;text-align:center;cursor:pointer;box-shadow:inset 0 -5px rgba(0,0,0,.25)}.food:hover{transform:translateY(-2px)}.ico{font-size:44px}.nm{font-weight:900;font-size:18px}.stats{font-size:13px;color:#fff3bf;margin-top:5px}
.grid{min-height:330px;background:#06182d;border:3px solid #42d2ff;border-radius:18px;display:flex;flex-wrap:wrap;align-content:flex-end;gap:6px;padding:10px}.block{width:70px;height:70px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px;background:#2e8b57;border:3px solid #9fff61;cursor:pointer}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tcard{background:#0b2038;border:2px solid #42d2ff;border-radius:14px;text-align:center;padding:12px}.num{font-size:38px;font-weight:900;color:#7CFF4E}.label{font-size:13px;color:#bfd7ff}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{background:#263a4d;border:2px solid #8aa7bf;border-radius:999px;padding:8px 12px;font-weight:800}.chip.ok{background:#153b22;border-color:#7cff4e;color:#aaff84}button{border:0;border-radius:12px;padding:12px 16px;font-weight:900;margin:8px 6px 0 0;cursor:pointer}.next{background:#ffd44a;color:#172033}.clear{background:#ddd}.status{margin-top:12px;padding:13px;border-radius:14px;font-weight:900;background:#293247}.okstat{background:#17472b;color:#aaff84}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.foods{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>MISSIONE FIBRE</h1><p>Gioco a livelli: costruisci blocchi-alimento, controlla fibre e kcal, supera tutti gli 8 livelli.</p></header><div class="levels" id="levels"></div><div class="wrap"><section class="panel"><h2>Dispensa a blocchi</h2><div class="foods" id="foods"></div></section><section class="panel"><h2 id="ltitle"></h2><div id="goal"></div><div class="checks" id="checks"></div><div class="grid" id="grid"></div><div class="tot"><div class="tcard"><div class="num" id="fib">0</div><div class="label">g fibre</div></div><div class="tcard"><div class="num" id="kcal">0</div><div class="label">kcal</div></div></div><div id="status" class="status">Scegli i blocchi per iniziare.</div><button class="clear" onclick="clearAll()">Svuota</button><button class="next" id="next" onclick="nextLevel()" disabled>Livello successivo</button></section></div><script>
const foods=[{"id": "apple", "name": "Mela", "icon": "\ud83c\udf4e", "kcal": 80, "fiber": 4, "cat": "frutta"}, {"id": "pear", "name": "Pera", "icon": "\ud83c\udf50", "kcal": 85, "fiber": 5, "cat": "frutta"}, {"id": "banana", "name": "Banana", "icon": "\ud83c\udf4c", "kcal": 105, "fiber": 3, "cat": "frutta"}, {"id": "bread", "name": "Pane integrale", "icon": "\ud83c\udf5e", "kcal": 100, "fiber": 3, "cat": "cereale"}, {"id": "cereal", "name": "Cereali", "icon": "\ud83e\udd63", "kcal": 114, "fiber": 2, "cat": "cereale"}, {"id": "legumes", "name": "Legumi", "icon": "\ud83e\uded8", "kcal": 110, "fiber": 6, "cat": "legume"}, {"id": "nuts", "name": "Frutta secca", "icon": "\ud83e\udd5c", "kcal": 120, "fiber": 2, "cat": "altro"}, {"id": "yogurt", "name": "Yogurt", "icon": "\ud83e\udd5b", "kcal": 100, "fiber": 0, "cat": "latticino"}, {"id": "biscuits", "name": "Biscotti", "icon": "\ud83c\udf6a", "kcal": 135, "fiber": 1, "cat": "dolce"}]; const levels=[{"title": "Livello 1", "goal": "Scegli almeno 1 alimento con fibre.", "checks": [{"t": "fiber_min", "v": 3, "l": "almeno 3 g fibre"}]}, {"title": "Livello 2", "goal": "Raggiungi almeno 5 g di fibre.", "checks": [{"t": "fiber_min", "v": 5, "l": "almeno 5 g fibre"}]}, {"title": "Livello 3", "goal": "Arriva tra 250 e 400 kcal con almeno 7 g di fibre.", "checks": [{"t": "kcal_range", "min": 250, "max": 400, "l": "250\u2013400 kcal"}, {"t": "fiber_min", "v": 7, "l": "almeno 7 g fibre"}]}, {"title": "Livello 4", "goal": "Usa almeno 1 frutto e 1 cereale, con almeno 6 g fibre.", "checks": [{"t": "cat_min", "cat": "frutta", "v": 1, "l": "almeno 1 frutto"}, {"t": "cat_min", "cat": "cereale", "v": 1, "l": "almeno 1 cereale"}, {"t": "fiber_min", "v": 6, "l": "almeno 6 g fibre"}]}, {"title": "Livello 5", "goal": "Raggiungi 8 g fibre usando massimo 3 blocchi.", "checks": [{"t": "fiber_min", "v": 8, "l": "almeno 8 g fibre"}, {"t": "count_max", "v": 3, "l": "massimo 3 blocchi"}]}, {"title": "Livello 6", "goal": "Stai tra 300 e 450 kcal con almeno 10 g di fibre.", "checks": [{"t": "kcal_range", "min": 300, "max": 450, "l": "300\u2013450 kcal"}, {"t": "fiber_min", "v": 10, "l": "almeno 10 g fibre"}]}, {"title": "Livello 7", "goal": "Usa legumi + frutta e raggiungi almeno 12 g fibre sotto 500 kcal.", "checks": [{"t": "cat_min", "cat": "legume", "v": 1, "l": "almeno 1 legume"}, {"t": "cat_min", "cat": "frutta", "v": 1, "l": "almeno 1 frutto"}, {"t": "fiber_min", "v": 12, "l": "almeno 12 g fibre"}, {"t": "kcal_max", "v": 499, "l": "meno di 500 kcal"}]}, {"title": "Livello 8 \u00b7 Boss", "goal": "Esattamente 4 blocchi: frutto + cereale + legume, 15 g fibre e 350\u2013500 kcal.", "checks": [{"t": "count_eq", "v": 4, "l": "esattamente 4 blocchi"}, {"t": "cat_min", "cat": "frutta", "v": 1, "l": "almeno 1 frutto"}, {"t": "cat_min", "cat": "cereale", "v": 1, "l": "almeno 1 cereale"}, {"t": "cat_min", "cat": "legume", "v": 1, "l": "almeno 1 legume"}, {"t": "fiber_min", "v": 15, "l": "almeno 15 g fibre"}, {"t": "kcal_range", "min": 350, "max": 500, "l": "350\u2013500 kcal"}]}]; let level=0, tray=[], done=Array(levels.length).fill(false);
function totals(){return {fiber:tray.reduce((s,f)=>s+f.fiber,0),kcal:tray.reduce((s,f)=>s+f.kcal,0),count:tray.length}};
function cat(c){return tray.filter(f=>f.cat===c).length};
function check(c,t){if(c.t==='fiber_min')return t.fiber>=c.v;if(c.t==='kcal_range')return t.kcal>=c.min&&t.kcal<=c.max;if(c.t==='kcal_max')return t.kcal<=c.v;if(c.t==='cat_min')return cat(c.cat)>=c.v;if(c.t==='count_max')return t.count<=c.v;if(c.t==='count_eq')return t.count===c.v;return false};
function renderFoods(){document.getElementById('foods').innerHTML=foods.map((f,i)=>`<div class='food' onclick='add(${i})'><div class='ico'>${f.icon}</div><div class='nm'>${f.name}</div><div class='stats'>${f.kcal} kcal · ${f.fiber} g fibre</div></div>`).join('')};
function renderLevels(){document.getElementById('levels').innerHTML=levels.map((l,i)=>`<div class='lv ${i===level?'active':''} ${done[i]?'done':''}'>${done[i]?'✓':i+1}</div>`).join('')};
function add(i){tray.push(foods[i]);update()}; function clearAll(){tray=[];update()}; function nextLevel(){if(!done[level])return;if(level<levels.length-1){level++;tray=[];renderLevel();update()}else{document.getElementById('status').textContent='Percorso completato!'}};
function renderLevel(){let l=levels[level];document.getElementById('ltitle').textContent=l.title;document.getElementById('goal').textContent=l.goal;renderLevels()};
function update(){let t=totals();document.getElementById('grid').innerHTML=tray.map((f,i)=>`<div class='block' onclick='tray.splice(${i},1);update()'>${f.icon}</div>`).join('') || 'Clicca gli alimenti nella dispensa.';document.getElementById('fib').textContent=t.fiber;document.getElementById('kcal').textContent=t.kcal;let l=levels[level];let all=l.checks.every(c=>check(c,t));document.getElementById('checks').innerHTML=l.checks.map(c=>`<span class='chip ${check(c,t)?'ok':''}'>${check(c,t)?'✓ ':''}${c.l}</span>`).join('');let st=document.getElementById('status');let nx=document.getElementById('next');if(all&&tray.length){done[level]=true;st.className='status okstat';st.textContent='Livello superato!';nx.disabled=false}else{st.className='status';st.textContent='Non ancora: modifica i blocchi.';nx.disabled=true}renderLevels()};
renderFoods();renderLevel();update();</script></body></html>
