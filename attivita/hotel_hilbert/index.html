<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Infinito — Gioco a missioni</title>
<style>
:root{
  --cream:#f3eadc; --ink:#13221d; --orange:#e7641b; --green:#173b31;
  --court:#3b3b38; --line:#f4efe5; --muted:#71685f; --good:#dcebdc; --bad:#f3d5cc;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:
    linear-gradient(rgba(243,234,220,.97),rgba(243,234,220,.97)),
    repeating-linear-gradient(0deg,#0000 0 30px,#0000000d 31px);
}
.app{max-width:1000px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:clamp(30px,6vw,58px);letter-spacing:.02em}
.level{font-weight:900;color:var(--orange)}
.progress{height:12px;background:#ddd2c2;border-radius:99px;overflow:hidden;margin:10px 0 14px}
.progress div{height:100%;background:var(--orange);width:14.28%;transition:.25s}
.card{
  border:3px solid var(--green);border-radius:26px;background:#fbf7ef;
  padding:clamp(16px,3vw,28px);min-height:650px;display:flex;flex-direction:column
}
.kicker{font-weight:1000;letter-spacing:.09em;color:var(--orange);font-size:14px}
h1{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:clamp(34px,7vw,64px);margin:4px 0 0;line-height:.95}
.sub{font-size:clamp(17px,3vw,22px);margin:6px 0 12px;color:var(--muted);font-weight:700}
.hotel{
  background:linear-gradient(#d9d2c6,#c7bdae);border-radius:22px;padding:16px 12px;
  display:grid;grid-template-columns:repeat(8,1fr);gap:9px;width:100%;margin:4px auto 18px;
  border:3px solid #857a6e
}
.room{
  min-width:0;aspect-ratio:.72;background:var(--green);border:3px solid #0e261f;border-radius:8px;
  position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:white
}
.room .num{
  position:absolute;top:5px;left:50%;transform:translateX(-50%);
  background:#eee0c4;color:var(--ink);padding:2px 7px;border-radius:5px;font-weight:1000;font-size:17px
}
.person{font-size:clamp(27px,5vw,44px);filter:drop-shadow(0 2px 0 #0004)}
.empty{background:#8f968f;border-style:dashed}
.newperson{color:var(--orange)}
.arrow{font-size:28px;color:var(--orange);font-weight:1000;text-align:center}
.rule{
  margin:4px auto 16px;display:inline-flex;align-items:center;gap:12px;justify-content:center;
  padding:10px 18px;background:var(--court);color:white;border-radius:16px;font-size:clamp(23px,5vw,42px);font-weight:1000
}
.visual{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
button{
  border:3px solid var(--green);background:white;color:var(--ink);border-radius:17px;
  padding:13px 16px;font-size:18px;min-height:58px;font-weight:1000;cursor:pointer
}
button:hover{transform:translateY(-1px)}
button:focus-visible{outline:4px solid #ed9b6a;outline-offset:2px}
.correct{background:var(--good);border-color:#377549}
.wrong{background:var(--bad);border-color:#a84632}
.feedback{text-align:center;font-size:20px;font-weight:1000;min-height:35px;margin-top:10px}
.next{display:none;background:var(--orange);border-color:var(--orange);color:#fff;margin-top:8px}
.next.show{display:block}
.hint{text-align:center;font-size:14px;color:var(--muted);margin-top:10px}
.bus{
  width:min(520px,90%);height:130px;background:var(--orange);border:4px solid var(--green);
  border-radius:28px 28px 15px 15px;display:flex;align-items:center;justify-content:space-evenly;
  padding:12px;position:relative;margin:12px auto
}
.bus:after,.bus:before{content:"";position:absolute;bottom:-20px;width:44px;height:44px;border-radius:50%;background:#222}
.bus:before{left:60px}.bus:after{right:60px}
.bus span{font-size:34px;background:#f3eadc;border-radius:8px;padding:5px}
.mapping{display:grid;grid-template-columns:auto auto auto;gap:7px 14px;align-items:center;font-size:clamp(22px,4vw,38px);font-weight:1000}
.mapping .a{color:var(--orange)}
.final{text-align:center;padding:30px 10px}
.final .trophy{font-size:100px}.score{font-size:72px;font-weight:1000;color:var(--green)}
@media(max-width:700px){
 .hotel{grid-template-columns:repeat(4,1fr)}
 .choices{grid-template-columns:1fr}
 .card{min-height:700px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">HOTEL ∞</div>
    <div class="level" id="levelLabel">Missione 1/7</div>
  </div>
  <div class="progress"><div id="progressBar"></div></div>

  <section class="card">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="visual" id="visual"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button type="button" class="next" id="nextBtn">MISSIONE SUCCESSIVA →</button>
    <div class="hint">Se sbagli, riprova. L’obiettivo è trovare una regola che funzioni per tutte le camere.</div>
  </section>
</div>

<script>
(()=>{
const levels = [
 {
  k:"MISSIONE 1 · UNA PERSONA",
  t:"L’hotel è pieno. Arriva 1 nuovo ospite.",
  s:"Come libero la camera 1 senza cacciare nessuno?",
  kind:"hotel",
  rule:"?",
  choices:["Ogni ospite va da n a n+1","Sposto solo l’ospite 1","Metto due persone nella camera 1","Non si può fare"],
  answer:0
 },
 {
  k:"MISSIONE 2 · DUE PERSONE",
  t:"Arrivano 2 nuovi ospiti.",
  s:"Devo liberare le camere 1 e 2.",
  kind:"hotel2",
  rule:"?",
  choices:["n → n+1","n → n+2","n → 2n","n → n−2"],
  answer:1
 },
 {
  k:"MISSIONE 3 · CINQUE PERSONE",
  t:"Arrivano 5 nuovi ospiti.",
  s:"Quale regola libera le prime 5 camere?",
  kind:"mapping5",
  choices:["n → n+5","n → 5n","n → n−5","n → n²"],
  answer:0
 },
 {
  k:"MISSIONE 4 · REGOLA GENERALE",
  t:"Arrivano k nuovi ospiti.",
  s:"Quale regola funziona per qualsiasi numero finito k?",
  kind:"generic",
  choices:["n → n+k","n → k","n → n×k","n → n−k"],
  answer:0
 },
 {
  k:"MISSIONE 5 · BUS INFINITO",
  t:"Arriva un bus con infiniti nuovi ospiti.",
  s:"Ora non basta spostarsi di 1, 2 o 100.",
  kind:"bus",
  choices:["Vecchi ospiti: n→2n; nuovi ospiti nelle camere dispari","Vecchi ospiti: n→n+1","Metto tutti nel corridoio","È impossibile"],
  answer:0
 },
 {
  k:"MISSIONE 6 · PARI E DISPARI",
  t:"Perché n → 2n funziona?",
  s:"Guarda le camere liberate.",
  kind:"evenodd",
  choices:["I vecchi occupano solo le pari e restano libere tutte le dispari","Perché 2n è sempre dispari","Perché l’hotel raddoppia le camere","Perché infinito ÷ 2 = 0"],
  answer:0
 },
 {
  k:"MISSIONE 7 · SUPER SFIDA",
  t:"Quale idea rende strano l’Hotel di Hilbert?",
  s:"Tutte le camere sono occupate… eppure posso fare spazio.",
  kind:"final",
  choices:["Con infiniti elementi posso riorganizzare tutti gli ospiti e liberare nuove camere","∞ è il numero più grande","1÷0=∞","Le camere vuote erano nascoste"],
  answer:0
 }
];

let level=0, score=0, locked=false;
const $ = id => document.getElementById(id);
const visual=$("visual"), choices=$("choices"), feedback=$("feedback"), nextBtn=$("nextBtn");

function rooms(empty=[]) {
 let html='<div class="hotel">';
 for(let i=1;i<=8;i++){
   const isEmpty=empty.includes(i);
   html+=`<div class="room ${isEmpty?'empty':''}"><span class="num">${i}</span>${isEmpty?'':'<span class="person">🧍</span>'}</div>`;
 }
 html+='</div>';
 return html;
}
function renderVisual(kind){
 if(kind==="hotel"){
   return rooms()+`<div class="rule">n → ?</div>`;
 }
 if(kind==="hotel2"){
   return rooms()+`<div class="rule">libera 1 e 2</div>`;
 }
 if(kind==="mapping5"){
   return `<div class="mapping">
     <span>camera n</span><span>→</span><span class="a">?</span>
     <span>1</span><span>→</span><span>6</span>
     <span>2</span><span>→</span><span>7</span>
     <span>3</span><span>→</span><span>8</span>
   </div>`;
 }
 if(kind==="generic"){
   return `<div class="mapping">
     <span>1</span><span>→</span><span>1+k</span>
     <span>2</span><span>→</span><span>2+k</span>
     <span>3</span><span>→</span><span>3+k</span>
     <span>n</span><span>→</span><span class="a">?</span>
   </div>`;
 }
 if(kind==="bus"){
   return `<div class="bus"><span>🧍</span><span>🧍</span><span>🧍</span><span>…</span></div>
     ${rooms()}
     <div class="rule">Serve liberare infinite camere</div>`;
 }
 if(kind==="evenodd"){
   return `<div class="mapping">
     <span>vecchio 1</span><span>→</span><span>2</span>
     <span>vecchio 2</span><span>→</span><span>4</span>
     <span>vecchio 3</span><span>→</span><span>6</span>
     <span>vecchio n</span><span>→</span><span class="a">2n</span>
   </div>
   <div style="margin-top:22px;font-size:28px;font-weight:1000;text-align:center">Camere libere: 1, 3, 5, 7, 9, …</div>`;
 }
 return `<div style="text-align:center">
   <div style="font-size:110px">∞</div>
   <div class="rule">PIENO ≠ impossibile da riorganizzare</div>
 </div>`;
}

function render(){
 locked=false;
 const L=levels[level];
 $("levelLabel").textContent=`Missione ${level+1}/7`;
 $("progressBar").style.width=`${((level+1)/7)*100}%`;
 $("kicker").textContent=L.k;
 $("title").textContent=L.t;
 $("subtitle").textContent=L.s;
 visual.innerHTML=renderVisual(L.kind);
 choices.innerHTML="";
 feedback.textContent="";
 nextBtn.classList.remove("show");

 L.choices.forEach((txt,i)=>{
   const b=document.createElement("button");
   b.type="button"; b.textContent=txt;
   b.addEventListener("click",()=>{
     if(locked) return;
     if(i===L.answer){
       locked=true; score++;
       b.classList.add("correct");
       feedback.textContent="✓ GIUSTO — la regola funziona per tutte le camere.";
       nextBtn.classList.add("show");
       if(L.kind==="hotel") visual.innerHTML=rooms([1])+`<div class="rule">n → n+1</div>`;
       if(L.kind==="hotel2") visual.innerHTML=rooms([1,2])+`<div class="rule">n → n+2</div>`;
       if(L.kind==="mapping5") visual.innerHTML+=`<div class="rule">n → n+5</div>`;
       if(L.kind==="generic") visual.innerHTML+=`<div class="rule">n → n+k</div>`;
       if(L.kind==="bus") visual.innerHTML=`<div class="bus"><span>🧍</span><span>🧍</span><span>🧍</span><span>…</span></div>${rooms([1,3,5,7])}<div class="rule">vecchi: n→2n · nuovi: 1,3,5,7,…</div>`;
     } else {
       b.classList.add("wrong");
       feedback.textContent="RIPROVA — deve funzionare per ogni ospite.";
       setTimeout(()=>b.classList.remove("wrong"),500);
     }
   });
   choices.appendChild(b);
 });
}

nextBtn.addEventListener("click",()=>{
 if(level<levels.length-1){ level++; render(); }
 else finish();
});

function finish(){
 $("kicker").textContent="HOTEL COMPLETATO";
 $("title").textContent="Hai capito il trucco di Hilbert";
 $("subtitle").textContent="L’infinito non si comporta come un hotel normale.";
 visual.innerHTML=`<div class="final"><div class="trophy">🏆</div><div class="score">${score}/7</div><p style="font-size:22px;font-weight:800">Regola chiave: con infiniti ospiti posso riorganizzare tutti senza arrivare a un’ultima camera.</p></div>`;
 choices.innerHTML="";
 feedback.textContent="";
 nextBtn.classList.remove("show");
 $("progressBar").style.width="100%";
 const b=document.createElement("button");
 b.type="button"; b.textContent="RIGIOCA";
 b.addEventListener("click",()=>{level=0;score=0;render()});
 choices.appendChild(b);
}

render();
})();
</script>
</body>
</html>
