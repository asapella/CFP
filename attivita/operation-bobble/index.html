</style><header><div class="brand">BUBBLE LAB</div><div class="tools"><select id="levels" aria-label="Livello"></select><button id="full">⛶ Schermo intero</button></div></header><main><section class="arena"><div id="titlebar"><div id="expr"></div><h1 id="title"></h1></div><p id="mission"></p><div id="wrap"><canvas id="game" width="1000" height="650" aria-label="Mira e clicca per sparare; frecce e spazio con la tastiera"></canvas></div><div id="message" role="status" aria-live="polite"></div></section><aside><div id="buildControls"><select id="mode" aria-label="Cosa sparare"><option value="group">Spara un gruppo</option><option value="unit">Spara una pallina</option><option value="sign">Cambia segno a un gruppo</option></select><div><p class="label">Segno del gruppo</p><div class="row"><button id="positive" class="red">Rosso +</button><button id="negative" class="blue">Blu −</button></div></div><div><p class="label">Segno delle palline</p><div class="row"><button id="red" class="red">Rossa +1</button><button id="blue" class="blue">Blu −1</button></div></div><div id="builder"><button id="minus" aria-label="Togli una pallina">−</button><div id="preview"></div><button id="plus" aria-label="Aggiungi una pallina">+</button></div><div id="count"></div><button id="fire">Spara</button><p class="small">Mira e clicca · oppure ← → e spazio</p><div class="row"><button id="undo">Annulla</button><button id="reset">Ricomincia</button></div></div><div id="answerBox" hidden><label id="answerLabel" for="answer">Scrivi il risultato</label><input id="answer" placeholder="+6 oppure −6" autocomplete="off"><button id="verify">Verifica</button><button id="back">Modifica i gruppi</button></div><div id="live"></div><button id="next" disabled>Scrivi il risultato →</button><div class="row utility"><button id="hint">Aiuto</button><button id="export">Esiti ↓</button></div><span id="storage" hidden></span><span id="hintText" hidden></span><span id="unit" hidden></span><progress id="progress" max="18" hidden></progress></aside></main><script>

{e:'3 × 2',a:3,x:2,t:'Tre gruppi da due'},

{e:'3 × (4 − 2)',a:3,x:2,t:'Aggiungi e cancella',hint:'Puoi mettere 4 rosse e poi 2 blu: restano 2 rosse.'},
{e:'2 × (−3)',a:2,x:-3,t:'Un contenuto negativo'},
{e:'4 × (−2)',a:4,x:-2,t:'Quattro copie negative'},
{e:'(−1) × 3',a:-1,x:3,t:'Prendere l’opposto'},
{e:'(−2) × 4',a:-2,x:4,t:'Due copie e cambio di segno'},
{e:'(−3) × (−2)',a:-3,x:-2,t:'Negativo per negativo'},
{e:'(−2) × (3 − 5)',a:-2,x:-2,t:'La parentesi diventa negativa',hint:'3 rosse e 5 blu: si cancellano 3 coppie. Restano 2 blu.'},
{e:'(−3) × 2 + 4',a:-3,x:2,b:4,t:'Un’aggiunta fuori dal gruppo'},
{division:true,e:'12 : 3 = x',a:3,x:4,target:12,t:'Dividere: cerca il fattore',hint:'Cerca x in 3 × x = 12. Devi ottenere tre gruppi uguali.'},
{division:true,e:'12 : (−3) = x',a:-3,x:-4,target:12,t:'Dividere per un negativo'},
{division:true,e:'(−15) : (−3) = x',a:-3,x:5,target:-15,t:'Un quoziente positivo'},

];
function bubble(x,y,r,s,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor='#0007';ctx.shadowBlur=8;ctx.shadowOffsetY=5;let gr=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);gr.addColorStop(0,s>0?'#ffdade':'#d9ffff');gr.addColorStop(.35,s>0?'#ff718c':'#62bafa');gr.addColorStop(.8,s>0?'#bd3459':'#2869b0');gr.addColorStop(1,s>0?'#692339':'#153754');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.fillStyle='#fff';ctx.font=`bold ${r*1.2}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s>0?'+':'−',x,y+1);ctx.restore()}
function text(t,x,y,size=20,col='#e8f2ff'){ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`600 ${size}px system-ui`;ctx.fillText(t,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const fmt=n=>String(n).replace('-','−'),signed=n=>n>0?'+'+n:fmt(n);
let saved={done:[],records:[]};try{let v=JSON.parse(localStorage.getItem('bubble-lab-signed-v5'));if(v&&Array.isArray(v.done)&&Array.isArray(v.records))saved=v}catch(e){}
let phase='build',solved=false,attempts=0;let idx=0,L,slots=[],draft=0,polarity=1,unitSign=1,mode='group',angle=-Math.PI/2,shot=null,history=[],particles=[],last=0,shots=0,start=0,recorded=false;
const origin={x:500,y:574};
function msg(t){$('message').textContent=t}
function persist(){try{localStorage.setItem('bubble-lab-signed-v5',JSON.stringify(saved))}catch(e){$('storage').textContent='Salvataggio locale non disponibile: scarica gli esiti.'}}
function resultValue(){return L.target!==undefined?L.x:L.a*L.x+(L.b||0)}
function current(){return slots.reduce((v,g)=>v+(g.filled?(L.division?g.n:g.sign*g.n):0),phase==='build'?(L.b||0):0)}
function correct(){return phase==='build'?slots.every(g=>g.filled&&g.n===(L.division?L.target/Math.abs(L.a):L.x)&&g.sign===Math.sign(L.a)):solved}
function update(message){$('preview').innerHTML=draft===0?'Vuota · 0':Array.from({length:Math.abs(draft)},()=>`<span class="mini ${draft<0?'neg':''}">${draft<0?'−':'+'}</span>`).join('');$('preview').style.borderColor=polarity>0?'#ff91a4':'#71caff';$('count').textContent='Contenuto: '+signed(draft);$('positive').className='red'+(polarity>0?' selected':'');$('negative').className='blue'+(polarity<0?' selected':'');$('buildControls').hidden=phase!=='build';$('builder').hidden=mode!=='group';$('red').className='red'+(unitSign>0?' selected':'');$('blue').className='blue'+(unitSign<0?' selected':'');$('unit').hidden=mode!=='unit';$('fire').textContent=mode==='group'?'Spara il gruppo':mode==='sign'?'Spara il nuovo segno':'Spara la pallina';$('fire').disabled=!!shot||phase!=='build';$('mode').disabled=phase!=='build';$('answerBox').hidden=phase==='build';$('undo').disabled=!!shot||!history.length||phase!=='build';
const ok=correct();$('live').textContent=phase==='build'?`Gruppi: ${slots.filter(g=>g.filled).length}/${slots.length}${L.target!==undefined?' · Devi ottenere '+fmt(L.target):''}`:'Osserva i gruppi e scrivi il risultato nel riquadro.';$('next').disabled=!ok||!!shot;$('next').textContent=phase==='build'?'Scrivi il risultato →':idx===17?'Percorso completo · Ricomincia':'Livello successivo →';
if(ok){msg(phase==='build'?'✓ Operazione costruita! Premi «Scrivi il risultato»: i gruppi resteranno visibili.':`✓ Risultato corretto: ${L.target!==undefined?'x = ':L.e+' = '}${fmt(resultValue())}.`);if(phase==='result'&&!recorded){recorded=true;if(!saved.done.includes(idx))saved.done.push(idx);saved.records.push({livello:idx+1,espressione:L.e,tiri:shots,tentativiRisultato:attempts,secondi:Math.round((Date.now()-start)/1000),data:new Date().toISOString()});persist()}}else if(message)msg(message);$('progress').value=saved.done.length}
function edit(v){let next=v>0?draft+unitSign:draft-Math.sign(draft);if(Math.abs(next)>24){msg('Massimo 24 palline per gruppo.');return}let cancelled=v>0&&draft*unitSign<0;draft=next;update(cancelled?'Una pallina positiva e una negativa si annullano.':'Prepara il gruppo e spara.');}
function load(i){idx=i;L=levels[i];phase='build';solved=false;attempts=0;$('answer').value='';draft=0;polarity=1;unitSign=1;mode='group';$('mode').value=mode;shot=null;history=[];particles=[];shots=0;start=Date.now();recorded=false;let k=Math.abs(L.a);slots=Array.from({length:k},(_,j)=>({x:500+(j-(k-1)/2)*215,y:225,r:88,n:0,sign:1,filled:false}));$('title').textContent=`${i+1} / 18 · Costruisci l’operazione`;$('expr').textContent=L.e;$('levels').value=i;$('hintText').textContent='';$('mission').textContent=L.division?`Distribuisci ${Math.abs(L.target)} palline ${L.target<0?'blu (−1)':'rosse (+1)'} in ${k} gruppi ${L.a<0?'blu (−)':'rossi (+)'}, in parti uguali.`:L.target!==undefined?`Trova x: riempi ${k} gruppi ${L.a<0?'negativi':'positivi'} uguali. Totale richiesto: ${fmt(L.target)}.`:`Crea ${k} gruppi ${L.a<0?'blu (−)':'rossi (+)'}, ciascuno con ${Math.abs(L.x)} palline ${L.x<0?'blu (−1)':'rosse (+1)'}.`;update('Scegli separatamente il segno del gruppo e quello delle palline.');}
function resultStage(){phase='result';solved=false;$('answer').value='';$('title').textContent=`${idx+1} / 18 · Scrivi il risultato`;$('answerLabel').textContent=L.target!==undefined?'Scrivi il valore di x':'Scrivi il risultato';$('mission').textContent='I gruppi restano visibili. Scrivi segno e numero, poi premi Verifica.';update('Conta le palline e osserva il colore dei gruppi.');$('answer').focus();}
function verify(){if(phase!=='result'||solved)return;let raw=$('answer').value.trim().replace(/−/g,'-');if(!/^[+-]?\d+$/.test(raw)){msg('Scrivi un numero intero con il suo segno, per esempio +6 oppure −6.');return}attempts++;if(Number(raw)===resultValue()){solved=true;update()}else{msg('Non ancora: ricontrolla quantità e segno guardando i gruppi. Puoi correggere la risposta.')}}
function trace(a,r){let x=origin.x,y=origin.y,vx=Math.cos(a),vy=Math.sin(a),path=[{x,y}];for(let k=0;k<1800;k++){x+=vx*2;y+=vy*2;if(x<r+8){x=r+8;vx=-vx}if(x>992-r){x=992-r;vx=-vx}path.push({x,y});for(let j=0;j<slots.length;j++)if(Math.hypot(x-slots[j].x,y-slots[j].y)<slots[j].r+r)return{path,target:j};if(y<r+6)return{path,target:-1}}return{path,target:-1}}
function fire(){if(shot||phase!=='build')return;let r=mode==='group'?39:13,plan=trace(angle,r);shot={...plan,pos:0,type:mode,n:mode==='group'?draft:unitSign,sign:polarity};shots++;update()}
function impact(s){if(s.target<0){update('Tiro fuori bersaglio.');return}let g=slots[s.target];history.push(slots.map(g=>({...g})));let note='';if(s.type==='group'){g.n=s.n;g.sign=s.sign;g.filled=true;note='Gruppo posizionato.'}else if(s.type==='sign'){if(!g.filled){history.pop();update('Prima crea un gruppo.');return}g.sign=s.sign;note='Segno del gruppo cambiato. Le palline mantengono il proprio segno.'}else{if(!g.filled){history.pop();update('Prima spara un gruppo, anche vuoto.');return}if(Math.abs(g.n+s.n)>24){history.pop();update('Massimo 24 palline.');return}let cancel=g.n*s.n<0;g.n+=s.n;note=cancel?'Una positiva e una negativa si annullano.':'Pallina aggiunta.'}for(let j=0;j<18;j++)particles.push({x:g.x,y:g.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:1});update(note)}
function soap(x,y,r,n,sg,filled=true,alpha=1){ctx.save();ctx.globalAlpha=alpha;let g=ctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r);g.addColorStop(0,filled?(sg>0?'#ffb2c555':'#a9e9ff55'):'#b5e6f62b');g.addColorStop(.65,filled?(sg>0?'#e3507028':'#3699e828'):'#74acda0a');g.addColorStop(1,filled?(sg>0?'#ff718e66':'#69bfff66'):'#a8d6ff42');ctx.fillStyle=g;ctx.strokeStyle=filled?(sg>0?'#ff8ca9':'#62c6ff'):'#9ab3c16b';ctx.lineWidth=filled?3:2;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#e6faffaa';ctx.beginPath();ctx.arc(x,y,r-5,3.7,4.65);ctx.stroke();ctx.strokeStyle='#e8abec99';ctx.beginPath();ctx.arc(x,y,r-4,.2,1.2);ctx.stroke();if(filled){let size=Math.abs(n)>9?(r>60?9:5):(r>60?13:7),spacing=size*2.2,cols=Math.abs(n)>9?6:3;for(let j=0;j<Math.abs(n);j++)bubble(x+(j%cols-(cols-1)/2)*spacing,y-8+Math.floor(j/cols)*spacing-size,size,Math.sign(n));if(n===0)text('0',x,y,18,'#b8d1e6');text(sg>0?'＋':'−',x,y-r+18,r>60?24:17,sg>0?'#ffb3c2':'#99e0ff')}ctx.restore()}
function draw(tm){let dt=Math.max(0,Math.min((tm-last)/1000||.016,.04));last=tm;ctx.clearRect(0,0,1000,650);let gr=ctx.createLinearGradient(0,0,0,650);gr.addColorStop(0,'#112c4b');gr.addColorStop(1,'#0b132a');ctx.fillStyle=gr;ctx.fillRect(0,0,1000,650);ctx.strokeStyle='#739db61b';for(let x=-500;x<1600;x+=110){ctx.beginPath();ctx.moveTo(500+(x-500)*.25,465);ctx.lineTo(x,650);ctx.stroke()}for(let y=470;y<650;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}text(L.division?'DIVIDI · distribuisci in parti uguali':'MOLTIPLICA · ripeti il contenuto dei gruppi',500,35,21,'#c4dbea');
if(!shot&&phase==='build'){let plan=trace(angle,mode==='group'?39:13);ctx.setLineDash([4,10]);ctx.strokeStyle='#ffe7a988';ctx.lineWidth=2;ctx.beginPath();plan.path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.setLineDash([])}
slots.forEach((g,j)=>{soap(g.x,g.y,g.r,g.n,g.sign,g.filled);text(g.filled?`Gruppo ${j+1}`:'Spara qui',g.x,85,18);if(g.filled){text('Gruppo '+(g.sign<0?'−':'+'),g.x,350,22);text('Palline: '+signed(g.n),g.x,385,20,'#cbd6e2')}});
if(L.b){soap(500,452,34,Math.abs(L.b),Math.sign(L.b));text('Fuori dai gruppi: '+signed(L.b),735,452,18,'#ffb4c5')}
if(phase==='result')text(L.division?'Confronta segno delle palline e segno dei gruppi':L.a<0?'Ogni gruppo negativo prende l’opposto del contenuto':'Somma i contenuti dei gruppi',500,440,18,'#a0d9ff');
ctx.save();ctx.translate(origin.x,origin.y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,40,67,15,0,0,7);ctx.fill();ctx.fillStyle='#536d88';ctx.beginPath();ctx.arc(0,20,45,Math.PI,Math.PI*2);ctx.lineTo(45,40);ctx.lineTo(-45,40);ctx.fill();ctx.rotate(angle+Math.PI/2);let barrel=ctx.createLinearGradient(-20,0,20,0);barrel.addColorStop(0,'#345773');barrel.addColorStop(.5,'#adc7d8');barrel.addColorStop(1,'#29415e');ctx.fillStyle=barrel;rr(-20,-65,40,72,9);ctx.fill();ctx.restore();
if(shot){shot.pos+=dt*310;let k=Math.floor(shot.pos);if(k>=shot.path.length){let s=shot;shot=null;impact(s)}else{let p=shot.path[k];if(shot.type==='group')soap(p.x,p.y,39,shot.n,shot.sign);else if(shot.type==='sign')soap(p.x,p.y,13,0,shot.sign);else bubble(p.x,p.y,13,shot.n)}}else{let x=origin.x+Math.cos(angle)*72,y=origin.y+Math.sin(angle)*72;if(mode==='group')soap(x,y,39,draft,polarity);else if(mode==='sign')soap(x,y,13,0,polarity);else bubble(x,y,13,unitSign)}
particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=Math.max(0,p.life);ctx.strokeStyle='#b3ebff';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.stroke()});ctx.globalAlpha=1;requestAnimationFrame(draw)}

levels.forEach((l,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${l.e}`;$('levels').append(o)});
canvas.addEventListener('pointermove',aim);canvas.addEventListener('pointerdown',e=>{aim(e);fire()});$('plus').onclick=()=>edit(1);$('minus').onclick=()=>edit(-1);$('positive').onclick=()=>{polarity=1;update()};$('negative').onclick=()=>{polarity=-1;update()};$('red').onclick=()=>{unitSign=1;update()};$('blue').onclick=()=>{unitSign=-1;update()};$('mode').onchange=e=>{mode=e.target.value;update()};$('fire').onclick=fire;$('reset').onclick=()=>load(idx);$('undo').onclick=()=>{if(phase==='build'&&!shot&&history.length){slots=history.pop();update('Ultimo tiro annullato.')}};$('next').onclick=()=>{if(correct()&&!shot){if(phase==='build')resultStage();else load((idx+1)%18)}};$('levels').onchange=e=>load(+e.target.value);$('hint').onclick=()=>{msg(L.division?'Il colore dei gruppi indica il divisore. Distribuisci le palline senza cambiarne il segno. Stesso segno: quoziente positivo. Segni diversi: negativo.':L.a<0?'Un gruppo negativo prende l’opposto del contenuto: palline negative danno un contributo positivo e viceversa.':L.hint||'Il gruppo positivo mantiene il valore delle palline. Ripeti lo stesso contenuto in ogni gruppo.')};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){msg('Per lo schermo intero premi F11 nel browser.')}};$('export').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify({gioco:'Bubble Lab bolle di sapone',...saved},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='Bubble_Lab_esiti.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('verify').onclick=verify;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verify()}});$('back').onclick=()=>{phase='build';solved=false;$('title').textContent=`${idx+1} / 18 · Modifica i gruppi`;$('mission').textContent='Correggi i gruppi, poi torna a scrivere il risultato.';update('Puoi sostituire i gruppi o aggiungere palline.');};
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')angle=Math.max(-Math.PI+.13,angle-.045);if(e.key==='ArrowRight')angle=Math.min(-.13,angle+.045);if(e.key===' '&&!e.repeat)fire()});load(0);requestAnimationFrame(draw);
